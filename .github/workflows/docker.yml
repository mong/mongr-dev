name: Publish Docker image
on:
  release:
    types: [published]
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 18 * * 0' # run Sundays at 18

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  push_to_registries:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {name: rstudio}
          - {name: code-server}
    name: Image mongr-dev-${{ matrix.config.name }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: "${{ matrix.config.name }}/Dockerfile"
      - name: Prepare tags
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: hnskde/mongr-dev-${{ matrix.config.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=schedule,pattern=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.config.name }}/.
          file: ./${{ matrix.config.name }}/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          secrets: "gh_pat=${{ github.token }}"
          cache-from: ${{ github.event_name != 'schedule' && 'type=gha' || '' }} # not used for scheduled builds
          cache-to: type=gha,mode=max
